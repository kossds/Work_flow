<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroAgent — Мультимодальный помощник</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
            width: 100%;
            max-width: 850px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-2px);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #666;
            font-size: 1rem;
            line-height: 1.5;
        }

        .input-area {
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 16px;
            font-size: 16px;
            font-family: inherit;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            background: white;
            resize: vertical;
            transition: all 0.3s ease;
            outline: none;
        }

        textarea:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 14px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .btn:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            filter: grayscale(30%);
        }

        .loader {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            color: #667eea;
            font-weight: 500;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #output {
            margin-top: 25px;
            padding: 24px;
            background: #f8fafc;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            min-height: 60px;
            line-height: 1.7;
            color: #334155;
            word-wrap: break-word;
            transition: all 0.3s ease;
        }

        #output:empty {
            display: none;
        }

        #output img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            margin: 10px 0;
        }

        #output h3 {
            color: #1e293b;
            margin: 16px 0 8px;
            font-size: 1.3rem;
        }

        #output strong {
            color: #667eea;
        }

        #output ul {
            margin: 12px 0;
            padding-left: 24px;
        }

        #output li {
            margin-bottom: 6px;
        }

        .error {
            color: #ef4444;
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .container {
                padding: 24px;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 NeuroAgent</h1>
            <p class="subtitle">Задайте вопрос или попросите нарисовать — AI сам решит, что делать</p>
        </div>

        <div class="input-area">
            <textarea id="prompt" placeholder="Напишите ваш запрос..."></textarea>
        </div>

        <button id="submitBtn" class="btn">
            <span>✨</span> Отправить
        </button>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <span id="loaderText">Анализирую запрос...</span>
        </div>

        <div id="output"></div>
    </div>

    <script>
        const promptField = document.getElementById('prompt');
        const submitBtn = document.getElementById('submitBtn');
        const outputDiv = document.getElementById('output');
        const loader = document.getElementById('loader');
        const loaderText = document.getElementById('loaderText');

        function isImagePrompt(prompt) {
            const lower = prompt.toLowerCase().trim();
            const triggers = ["нарисуй", "создай изображение", "сгенерируй картинку", "изобрази", "картинка", "изображение",
                "нарисуй мне", "создай картину", "покажи картинку", "picture of", "generate image", "draw", "create an image", "visualize"];
            for (const t of triggers) {
                if (lower.includes(t)) return true;
            }
            return /^(изображение|image|img):/i.test(lower);
        }

        submitBtn.addEventListener('click', async () => {
            const prompt = promptField.value.trim();
            if (!prompt) return;

            submitBtn.disabled = true;
            outputDiv.innerHTML = '';
            loader.style.display = 'flex';

            const isImage = isImagePrompt(prompt);
            loaderText.textContent = isImage ? '🎨 Генерирую изображение...' : '🧠 Ищу лучший ответ...';

            try {
                const response = await fetch('/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({prompt: prompt})
                });
                const data = await response.json();

                if (data.error) {
                    outputDiv.innerHTML = `<p class="error">❌ Ошибка: ${data.error}</p>`;
                } else if (data.type === 'text') {
                    // Текст уже приходит в HTML-формате (Markdown преобразован на сервере)
                    outputDiv.innerHTML = data.content;
                } else if (data.type === 'image') {
                    const img = new Image();
                    img.onload = () => {
                        outputDiv.innerHTML = '';
                        outputDiv.appendChild(img);
                    };
                    img.onerror = () => {
                        outputDiv.innerHTML = '<p class="error">🖼️ Не удалось загрузить изображение. Попробуйте снова.</p>';
                    };
                    img.src = data.content;
                    img.alt = "Сгенерированное изображение";
                }
            } catch (err) {
                outputDiv.innerHTML = `<p class="error">🌐 Сетевая ошибка: ${err.message}</p>`;
            } finally {
                submitBtn.disabled = false;
                loader.style.display = 'none';
            }
        });

        promptField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitBtn.click();
            }
        });
    </script>
</body>
</html>
